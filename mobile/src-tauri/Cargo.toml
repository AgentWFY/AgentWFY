[package]
name = "agentwfy-mobile"
version = "0.1.0"
description = "AgentWFY mobile client"
authors = ["endenwer"]
edition = "2021"

[lib]
name = "agentwfy_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
tauri = { version = "2.11.2", features = [] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
